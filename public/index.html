<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Stranger – random text and video chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8eef6; --panel: #ffffff; --ink: #14213d; --muted: #5b6785;
    --you: #0e9f8e; --them: #ffd447; --danger: #d64550; --line: #cfd8e6;
    --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1526; --panel: #182038; --ink: #eef2fb; --muted: #9aa6c4; --line: #2b3557; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--you); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- landing ---------- */
  #landing { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .hero { width: min(560px, 100%); }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 9vw, 4.4rem); line-height: 1; margin: 0 0 16px; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0 0 28px; max-width: 46ch; }
  .online { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--you); }
  .card { background: var(--panel); border: 2px solid var(--ink); border-radius: 14px; padding: 22px; box-shadow: 6px 6px 0 var(--ink); }
  label.field { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: transparent; }
  .hint { font-size: .875rem; color: var(--muted); margin: 6px 0 16px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 18px; font-size: .9rem; }
  .check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--you); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { border: 2px solid var(--ink); border-radius: 10px; padding: 12px 20px; font-weight: 600; cursor: pointer; background: var(--panel); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--them); color: #14213d; flex: 1; }
  .btn.alt { background: var(--you); color: #fff; flex: 1; }
  .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn:not(:disabled):active { transform: translate(2px, 2px); }
  .err { color: var(--danger); font-weight: 600; min-height: 1.4em; margin: 10px 0 0; }

  /* ---------- chat ---------- */
  #chat { height: 100%; display: flex; flex-direction: column; }
  header.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 2px solid var(--ink); background: var(--panel); }
  .brand { font-family: var(--display); font-weight: 800; font-size: 1.25rem; }
  #status { color: var(--muted); font-weight: 600; text-align: center; flex: 1; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; }
  .main.video { grid-template-columns: minmax(0, 1.2fr) minmax(320px, 1fr); }
  .videos { position: relative; background: #0b1020; min-height: 0; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #0b1020; }
  #localVideo { position: absolute; right: 12px; bottom: 12px; width: 26%; max-width: 180px; border-radius: 10px; border: 2px solid #fff; background: #000; transform: scaleX(-1); }
  .panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .sys { text-align: center; color: var(--muted); font-size: .875rem; padding: 4px 0; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: var(--you); color: #fff; border-bottom-right-radius: 3px; }
  .msg.them { align-self: flex-start; background: var(--them); color: #14213d; border-bottom-left-radius: 3px; }
  #typing { height: 22px; padding: 0 16px; color: var(--muted); font-size: .85rem; }
  form.send { display: flex; gap: 8px; padding: 12px; border-top: 2px solid var(--ink); }
  form.send input { flex: 1; }
  .actions { display: flex; gap: 8px; }
  .btn.small { padding: 7px 12px; font-size: .9rem; }
  @media (max-width: 760px) {
    .main.video { grid-template-columns: 1fr; grid-template-rows: 38% 1fr; }
    .brand { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- ============ LANDING ============ -->
<main id="landing">
  <section class="hero">
    <div class="online" aria-live="polite"><span class="dot"></span><span><b id="onlineCount">0</b> people online now</span></div>
    <h1>Say hi to someone new.</h1>
    <p class="lead">Chat by text or video with a random person. No sign-up. Press Next any time to meet someone else.</p>

    <div class="card">
      <label class="field" for="interests">Interests (optional)</label>
      <input id="interests" type="text" placeholder="music, football, coding" autocomplete="off">
      <p class="hint">Separate with commas. We try to match you with someone who shares one.</p>

      <label class="check">
        <input type="checkbox" id="agree">
        <span>I am 18 or older. I agree to be respectful and not share personal or illegal content. Chats are not recorded, but abusive users can be reported and banned.</span>
      </label>

      <div class="row">
        <button class="btn primary" id="startText" disabled>Text chat</button>
        <button class="btn alt" id="startVideo" disabled>Video chat</button>
      </div>
      <p class="err" id="err" role="alert"></p>
    </div>
  </section>
</main>

<!-- ============ CHAT ============ -->
<section id="chat" class="hidden">
  <header class="bar">
    <span class="brand">Hello Stranger</span>
    <span id="status" aria-live="polite">Looking for someone…</span>
    <div class="actions">
      <button class="btn small danger" id="reportBtn" title="Report this person">Report</button>
      <button class="btn small primary" id="nextBtn">Next</button>
      <button class="btn small" id="stopBtn">Stop</button>
    </div>
  </header>
  <div class="main" id="mainArea">
    <div class="videos hidden" id="videoBox">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="panel">
      <div id="log" role="log" aria-live="polite"></div>
      <div id="typing"></div>
      <form class="send" id="sendForm" autocomplete="off">
        <input type="text" id="msgInput" placeholder="Type a message" maxlength="500" disabled aria-label="Message">
        <button class="btn primary" id="sendBtn" disabled>Send</button>
      </form>
    </div>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const socket = io();
  const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:YOUR_TURN_HOST:443', username: 'nishant799', credential: 'qwerty' }
  ] };
  // For users behind strict NATs add a TURN server here (see README).

  let mode = 'text', interests = [];
  let pc = null, localStream = null, connected = false, typingTimer = null;

  // ---------- landing ----------
  const agree = $('agree');
  agree.addEventListener('change', () => {
    $('startText').disabled = $('startVideo').disabled = !agree.checked;
  });
  socket.on('online', (n) => ($('onlineCount').textContent = n));
  socket.on('banned', () => {
    alert('You have been temporarily banned after multiple reports.');
    location.reload();
  });

  $('startText').onclick = () => start('text');
  $('startVideo').onclick = () => start('video');

  async function start(m) {
    mode = m;
    $('err').textContent = '';
    interests = $('interests').value.split(',').map((s) => s.trim().toLowerCase()).filter(Boolean).slice(0, 5);

    if (mode === 'video') {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        $('localVideo').srcObject = localStream;
      } catch (e) {
        $('err').textContent = 'Camera or microphone blocked. Allow access in your browser, or use text chat.';
        return;
      }
    }
    $('landing').classList.add('hidden');
    $('chat').classList.remove('hidden');
    $('mainArea').classList.toggle('video', mode === 'video');
    $('videoBox').classList.toggle('hidden', mode !== 'video');
    findPartner();
  }

  // ---------- matching ----------
  function findPartner() {
    closePeer();
    connected = false;
    $('log').innerHTML = '';
    setInputEnabled(false);
    setStatus('Looking for someone…');
    socket.emit('find', { mode, interests });
  }

  socket.on('waiting', () => setStatus('Waiting for someone to join…'));

  socket.on('matched', async ({ initiator, common }) => {
    connected = true;
    setStatus('Connected. Say hi!');
    setInputEnabled(true);
    sys('You are now chatting with a stranger.' + (common && common.length ? ' You both like: ' + common.join(', ') + '.' : ''));
    $('msgInput').focus();
    if (mode === 'video') await setupPeer(initiator);
  });

  socket.on('partner-left', () => {
    connected = false;
    closePeer();
    setInputEnabled(false);
    setStatus('Stranger disconnected.');
    sys('The stranger left. Press Next to find someone new.');
    $('typing').textContent = '';
  });

  // ---------- messaging ----------
  $('sendForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('msgInput').value.trim();
    if (!text || !connected) return;
    socket.emit('message', text);
    bubble(text, 'me');
    $('msgInput').value = '';
    socket.emit('typing', false);
  });
  $('msgInput').addEventListener('input', () => {
    socket.emit('typing', true);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => socket.emit('typing', false), 1500);
  });
  socket.on('message', (t) => bubble(t, 'them'));
  socket.on('typing', (on) => ($('typing').textContent = on ? 'Stranger is typing…' : ''));

  function bubble(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text; // textContent prevents HTML injection (XSS)
    $('log').appendChild(d);
    $('log').scrollTop = $('log').scrollHeight;
  }
  function sys(text) {
    const d = document.createElement('div');
    d.className = 'sys';
    d.textContent = text;
    $('log').appendChild(d);
  }
  function setStatus(t) { $('status').textContent = t; }
  function setInputEnabled(on) {
    $('msgInput').disabled = $('sendBtn').disabled = !on;
  }

  // ---------- buttons ----------
  $('nextBtn').onclick = findPartner;
  $('stopBtn').onclick = () => {
    socket.emit('leave');
    closePeer();
    if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
    $('chat').classList.add('hidden');
    $('landing').classList.remove('hidden');
  };
  $('reportBtn').onclick = () => {
    if (!connected) return;
    if (confirm('Report this person for inappropriate behaviour and skip to someone new?')) {
      socket.emit('report');
      findPartner();
    }
  };
  socket.on('reported', () => {});

  // ---------- WebRTC ----------
  async function setupPeer(initiator) {
    pc = new RTCPeerConnection(RTC_CONFIG);
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
    pc.ontrack = (e) => { $('remoteVideo').srcObject = e.streams[0]; };
    pc.onicecandidate = (e) => { if (e.candidate) socket.emit('signal', { candidate: e.candidate }); };
    pc.onconnectionstatechange = () => {
      if (pc && pc.connectionState === 'failed') sys('Video connection failed. Try pressing Next.');
    };
    if (initiator) {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('signal', { sdp: pc.localDescription });
    }
  }

  const pendingIce = [];
  socket.on('signal', async (data) => {
    if (!pc) return;
    try {
      if (data.sdp) {
        await pc.setRemoteDescription(data.sdp);
        while (pendingIce.length) await pc.addIceCandidate(pendingIce.shift());
        if (data.sdp.type === 'offer') {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit('signal', { sdp: pc.localDescription });
        }
      } else if (data.candidate) {
        if (pc.remoteDescription) await pc.addIceCandidate(data.candidate);
        else pendingIce.push(data.candidate);
      }
    } catch (err) { console.error('signal error', err); }
  });

  function closePeer() {
    pendingIce.length = 0;
    if (pc) { pc.ontrack = pc.onicecandidate = null; pc.close(); pc = null; }
    $('remoteVideo').srcObject = null;
  }
})();
</script>
</body>
</html>
